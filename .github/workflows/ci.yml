name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          # [mcp] is not optional here: without it tests/test_mcp_providers.py
          # hits its importorskip and the MCP server goes untested on every run.
          # That blind spot is how the unbounded "mcp>=1.0" shipped an import
          # the v2 SDK had already deleted.
          python -m pip install -e ".[dev,mcp]"
          python -m pip install build

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest

      - name: Build package
        run: python -m build

      - name: Rehearse migration (fake HOME, throwaway venv)
        run: bash scripts/rehearse-migration.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Lint frontend
        working-directory: ui
        run: npm run lint

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Verify committed static bundle is current
        run: git diff --exit-code -- src/anyscribe/web/static

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install "markdown>=3.5,<4"

      - name: Render docs
        run: python scripts/build-docs.py

      - name: Committed HTML matches sources
        run: git diff --exit-code landing/docs

      - name: Version + capability drift gates
        run: python scripts/check-docs.py
